<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Aventura de Nico: Supermercado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>La Aventura de Nico</h1>
            <div id="stats">
                <span>Energía: <strong id="energy">100%</strong></span>
                <span>Tiempo: <strong id="time">100%</strong></span>
            </div>
        </header>
        <main>
            <div id="image-container">
                <!-- Acá irá la ilustración del nodo -->
                <p>[ Escenario actual ]</p>
            </div>
            <div id="text-container">
                <p id="narrative-text">Nico sale a oscuras del baño y nota que la puerta principal está trabada con candado.</p>
            </div>
            <div id="choices-container">
                <button class="choice-btn">Opción A: Ir a la Oficina del Gerente</button>
                <button class="choice-btn">Opción B: Ir al Pasillo del Depósito</button>
                <button class="choice-btn">Opción C: Conducto de Ventilación</button>
            </div>
        </main>
    </div>
</body>
</html>
